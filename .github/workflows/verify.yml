name: Weryfikacja Community
on: [push, pull_request]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python tools/check_test_discovery.py
      - run: python -B -m unittest discover -s tests
      - run: python tools/render_readme.py --check
      - run: python tools/check_public_release.py
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: for test in tests/test_*.cjs; do node "$test" || exit; done
      - run: node --test integrations/homer/tests/*.test.mjs
      - run: npm install --global corepack@0.34.6
      - run: python tools/build_snut.py --release-id community-ci-${{ github.sha }}
      - run: python tools/package_community_release.py
